<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flippy Chats AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--bg:#EDF1F8;--panel:#F7F9FD;--card:#fff;--ink:#0B1530;--mute:#5E6A89;--line:#D8E0EF;--brand:#2447E6;--on-brand:#fff;--sun:#FFD23F;--soft:#E3E9F8;--code:#0E1733;--code-ink:#E4EAFF;--danger:#D6334A;--r:18px}
[data-theme=dark]{--bg:#070C1F;--panel:#0B1330;--card:#111B3D;--ink:#E8EDFF;--mute:#8E9AC0;--line:#1D2954;--brand:#7E94FF;--on-brand:#070C1F;--soft:#18244F;--code:#050918;--danger:#FF6B80}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font:400 15px/1.55 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.i{width:18px;height:18px;flex-shrink:0}
.sidebar{width:290px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;flex-shrink:0;z-index:20;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;margin-bottom:18px}
.brand svg{width:32px;height:32px}
.brand b{font:600 17px Unbounded,sans-serif;letter-spacing:-.01em;flex:1}
.lock{display:flex;color:var(--mute)}
.new-chat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:500;margin-bottom:12px;transition:transform .15s}
.new-chat:active{transform:scale(.97)}
.search{position:relative;margin-bottom:10px;color:var(--mute)}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px}
.search input{width:100%;height:38px;padding:0 12px 0 36px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;outline:none}
.search input:focus{border-color:var(--brand)}
.chat-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.grp{font-size:12px;font-weight:600;color:var(--mute);padding:14px 10px 6px}
.chat-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:12px;font-size:14px;cursor:pointer;color:var(--mute);transition:background .15s}
.chat-item:hover{background:var(--soft);color:var(--ink)}
.chat-item.active{background:var(--card);color:var(--ink);font-weight:500;box-shadow:inset 3px 0 0 var(--brand)}
.chat-item-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{opacity:0;color:var(--mute);display:flex;padding:4px;border-radius:8px}
.chat-item:hover .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--danger)}
.profile{display:flex;align-items:center;gap:10px;padding:14px 6px 0;margin-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sun);color:#0B1530;display:grid;place-items:center;font:600 13px Unbounded,sans-serif}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:8px;height:56px;padding:0 16px;flex-shrink:0}
.top h2{flex:1;font-size:14px;font-weight:500;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--mute);transition:background .15s}
.round:hover{background:var(--soft);color:var(--ink)}
#menuBtn{display:none}
.scroll{flex:1;min-height:0;overflow-y:auto;user-select:text;scroll-behavior:smooth}
.thread{max-width:760px;margin:0 auto;padding:8px 20px 24px;display:flex;flex-direction:column;gap:26px;min-height:100%}
.message.user{align-self:flex-end;max-width:82%;background:var(--brand);color:var(--on-brand);padding:11px 16px;border-radius:20px 20px 6px 20px;display:flex;flex-direction:column;gap:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.message.assistant{display:flex;gap:12px;align-items:flex-start}
.message.assistant>svg{width:28px;height:28px;flex-shrink:0;margin-top:2px}
.body{flex:1;min-width:0;overflow-wrap:anywhere}
.msg-img{max-width:260px;max-height:220px;border-radius:12px;object-fit:cover}
.file-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:5px 10px;font-size:13px;max-width:100%}
.file-chip .i{width:14px;height:14px;flex-shrink:0}
.file-chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.html-preview-card{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-top:4px;background:var(--card)}
.html-preview-topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line);font-size:13px;font-weight:500;color:var(--mute)}
.html-preview-topbar .dots-nav{display:flex;gap:5px}
.html-preview-topbar .dots-nav span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.html-preview-topbar .dots-nav span:nth-child(1){background:#FF6060}
.html-preview-topbar .dots-nav span:nth-child(2){background:#FFD23F}
.html-preview-topbar .dots-nav span:nth-child(3){background:#45D68A}
.html-preview-topbar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.html-preview-topbar button{font-size:12px;padding:3px 10px;border-radius:8px;border:1px solid var(--line);color:var(--mute);background:var(--card)}
.html-preview-topbar button:hover{color:var(--ink)}
.preview-frame{width:100%;border:0;display:block;background:#fff;transition:height .2s}
.md>*+*{margin-top:.75em}
.md h1,.md h2,.md h3{font:600 1.1em Unbounded,sans-serif;letter-spacing:-.01em;margin-top:1.2em}
.md ul,.md ol{padding-left:1.4em}.md li+li{margin-top:.3em}
.md a{color:var(--brand)}
.md code:not(pre code){font:500 .86em "JetBrains Mono",monospace;background:var(--soft);padding:.15em .4em;border-radius:6px}
.md blockquote{border-left:3px solid var(--sun);padding-left:14px;color:var(--mute)}
.md table{border-collapse:collapse;display:block;overflow-x:auto}.md th,.md td{border:1px solid var(--line);padding:6px 12px}
pre{background:var(--code);color:var(--code-ink);border-radius:14px;overflow:hidden;margin:.9em 0}
.cbar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 16px;font:500 12px "JetBrains Mono",monospace;color:#8E9AC0;border-bottom:1px solid rgba(255,255,255,.08)}
.cbar button{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;font:500 12px Onest,sans-serif;color:#C5CEF0}
.cbar button:hover{background:rgba(255,255,255,.1)}.cbar .i{width:14px;height:14px}
.cbar-preview{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;font:500 12px Onest,sans-serif;color:#C5CEF0;cursor:pointer}
.cbar-preview:hover{background:rgba(255,255,255,.1)}
pre code{display:block;overflow-x:auto;padding:14px 16px;font:400 13px/1.6 "JetBrains Mono",monospace;user-select:text}
.hljs-keyword,.hljs-selector-tag,.hljs-literal{color:#FF8FA3}.hljs-string,.hljs-attr{color:#8EE6B0}.hljs-number{color:#FFD23F}.hljs-comment{color:#6F7BA3;font-style:italic}.hljs-title,.hljs-built_in,.hljs-function{color:#8FB0FF}
.acts{display:flex;margin-top:6px}
.acts button{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);padding:4px 8px;margin-left:-8px;border-radius:8px}
.acts button:hover{background:var(--soft);color:var(--ink)}.acts .i{width:14px;height:14px}
.dots{display:flex;gap:5px;padding:12px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,70%,100%{transform:translateY(0);opacity:.4}35%{transform:translateY(-6px);opacity:1}}
.empty{margin:auto;text-align:left;width:100%;padding:24px 0}
@keyframes flip{from{transform:rotateY(-180deg) scale(.6)}to{transform:none}}
.empty h1{font:600 clamp(28px,5.4vw,46px)/1.1 Unbounded,sans-serif;letter-spacing:-.03em;max-width:12em}
.empty p{color:var(--mute);margin:14px 0 26px;max-width:30em}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sug{text-align:left;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.4;transition:border-color .15s,transform .15s}
.sug:hover{border-color:var(--brand);transform:translateY(-2px)}
.composer-wrap{padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));flex-shrink:0}
.composer{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px 12px 10px 18px;box-shadow:0 8px 30px -12px rgba(20,40,120,.25);transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.attach-chips{display:none;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.attach-chip{display:flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:4px 8px 4px 6px;font-size:13px;max-width:220px}
.attach-chip img{width:28px;height:28px;border-radius:7px;object-fit:cover;flex-shrink:0}
.attach-chip-icon{width:28px;height:28px;border-radius:7px;background:var(--brand);display:grid;place-items:center;flex-shrink:0}
.attach-chip-icon .i{width:14px;height:14px;color:var(--on-brand)}
.attach-chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.attach-chip-rm{display:flex;color:var(--mute);padding:2px;flex-shrink:0}
.attach-chip-rm:hover{color:var(--danger)}
textarea{width:100%;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;height:26px;max-height:200px;user-select:text;display:block}
textarea::placeholder{color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.tools{display:flex;gap:2px;margin-left:-8px}
.tools .round{width:34px;height:34px}
.send{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--mute);transition:all .2s}
.send.active{background:var(--brand);color:var(--on-brand)}
.hint{text-align:center;font-size:12px;color:var(--mute);margin-top:8px}
.scrim{display:none}
@media(max-width:820px){
 .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);padding-top:calc(18px + env(safe-area-inset-top,0px))}
 .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.35)}
 .scrim.show{display:block;position:fixed;inset:0;background:rgba(5,10,30,.5);z-index:10}
 #menuBtn{display:grid}.sugs{grid-template-columns:1fr}.hint{display:none}.thread{padding:8px 16px 20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<input type="file" id="fileInput" accept="image/*,text/*,.html,.htm,.css,.js,.ts,.json,.py,.md,.csv,.xml,.yaml,.yml,.txt,.sh,.env" hidden multiple>
<aside class="sidebar" id="sidebar">
  <div class="brand"><span data-logo></span><b>Flippy</b><span class="lock" data-ic="lock" title="Чаты хранятся в этом браузере в зашифрованном виде"></span></div>
  <button class="new-chat" id="newChatBtn"><span data-ic="plus"></span>Новый чат</button>
  <label class="search"><span data-ic="search"></span><input type="text" id="searchInput" placeholder="Поиск по чатам" aria-label="Поиск по чатам"></label>
  <div class="chat-list" id="chatList"></div>
  <div class="profile"><div class="avatar">F</div>flippy@figma.com</div>
</aside>
<div class="scrim" id="scrim"></div>
<main class="main">
  <header class="top">
    <button class="round" id="menuBtn" data-ic="menu" aria-label="Меню"></button>
    <h2 id="chatTitle"></h2>
    <button class="round" id="themeBtn" aria-label="Сменить тему"></button>
  </header>
  <div class="scroll" id="scroll"><div class="thread" id="chatWindow"></div></div>
  <div class="composer-wrap">
    <div class="composer">
      <div class="attach-chips" id="attachChips"></div>
      <textarea id="userInput" rows="1" placeholder="Напишите сообщение или перетащите файл"></textarea>
      <div class="row">
        <div class="tools">
          <button class="round" id="attachFileBtn" data-ic="paperclip" title="Прикрепить файл" aria-label="Прикрепить файл"></button>
          <button class="round" id="codeBtn" data-ic="code" title="Вставить блок кода" aria-label="Вставить блок кода"></button>
        </div>
        <button class="send" id="sendBtn" data-ic="send" aria-label="Отправить"></button>
      </div>
    </div>
    <div class="hint">Enter — отправить · Shift+Enter — новая строка · Перетащите файл в окно</div>
  </div>
</main>
<script>
const WORKER_ENDPOINT = "https://billowing-king-7514.fialkamy001.workers.dev";
let decryptedChats = [], currentChatId = null;
let attachedFiles = [];

const $ = id => document.getElementById(id);
const P = {
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  send:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  paperclip:'<path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
  moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  code:'<path d="M9 8l-5 4 5 4M15 8l5 4-5 4"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  file:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',
  maximize:'<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`;
const LOGO = '<svg viewBox="0 0 32 32" class="mark"><rect width="32" height="32" rx="10" fill="var(--brand)"/><path d="M7 21c4 0 5-9 11-9 0 3-1 5-3 6 4 0 7 2 10 4-4 1-9 1-12-1-2 1-4 1-6 0z" fill="var(--sun)"/></svg>';
document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = ic(e.dataset.ic));
document.querySelectorAll('[data-logo]').forEach(e => e.outerHTML = LOGO);

function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);$('themeBtn').innerHTML=ic(t==='dark'?'sun':'moon')}
setTheme(localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
const drawer=open=>{$('sidebar').classList.toggle('open',open);$('scrim').classList.toggle('show',open)};
$('menuBtn').onclick=()=>drawer(true);$('scrim').onclick=()=>drawer(false);

// 🔑 АВТОМАТИЧЕСКИЙ КЛЮЧ
function getOrCreateAutoKey(){let key=localStorage.getItem('auto_device_key');if(!key){const array=new Uint8Array(32);crypto.getRandomValues(array);key=Array.from(array,b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('auto_device_key',key)}return key}
const autoKey=getOrCreateAutoKey();

// 🛡️ AES-256-GCM ШИФРОВАНИЕ
async function deriveKey(passphrase,salt){const enc=new TextEncoder();const keyMaterial=await crypto.subtle.importKey("raw",enc.encode(passphrase),{name:"PBKDF2"},false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},keyMaterial,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encryptPayload(dataObj,passphrase){const salt=crypto.getRandomValues(new Uint8Array(16));const iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(passphrase,salt);const enc=new TextEncoder();const ciphertext=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(JSON.stringify(dataObj)));return{salt:Array.from(salt),iv:Array.from(iv),ciphertext:Array.from(new Uint8Array(ciphertext))}}
async function decryptPayload(encryptedObj,passphrase){const salt=new Uint8Array(encryptedObj.salt);const iv=new Uint8Array(encryptedObj.iv);const ciphertext=new Uint8Array(encryptedObj.ciphertext);const key=await deriveKey(passphrase,salt);const decrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ciphertext);return JSON.parse(new TextDecoder().decode(decrypted))}

window.addEventListener('DOMContentLoaded',async()=>{await loadChatsDecrypted();renderChatList();decryptedChats.length?selectChat(decryptedChats[0].id):createNewChat()});
async function saveChatsEncrypted(){const encrypted=await encryptPayload(decryptedChats,autoKey);localStorage.setItem('bank_encrypted_chats',JSON.stringify(encrypted))}
async function loadChatsDecrypted(){const rawData=localStorage.getItem('bank_encrypted_chats');if(!rawData){decryptedChats=[];return}try{const encryptedObj=JSON.parse(rawData);decryptedChats=await decryptPayload(encryptedObj,autoKey)}catch(e){console.error("Ошибка расшифровки:",e);decryptedChats=[]}}

// ─── FILE HANDLING ───────────────────────────────────────────────
const TEXT_EXTS = /\.(html?|css|js|ts|tsx|jsx|json|py|md|txt|csv|xml|ya?ml|sh|env|c|cpp|h|rs|go|java|kt|rb|php|swift|sql)$/i;
const IMG_TYPES = /^image\//;
const fileInput = $('fileInput');$('attachFileBtn').onclick = () => fileInput.click();
fileInput.onchange = e => { [...e.target.files].forEach(handleFile); fileInput.value=''; };

function langFromName(name) {
  const m = name.match(/\.(\w+)$/);
  const ext = m ? m[1].toLowerCase() : '';
  return {html:'html',htm:'html',css:'css',js:'javascript',ts:'typescript',tsx:'tsx',jsx:'jsx',
          json:'json',py:'python',md:'markdown',sh:'bash',yaml:'yaml',yml:'yaml',
          xml:'xml',csv:'csv',sql:'sql',c:'c',cpp:'cpp',h:'c',rs:'rust',go:'go',
          java:'java',kt:'kotlin',rb:'ruby',php:'php',swift:'swift'}[ext] || ext || 'text';
}

function handleFile(file) {
  if (!file) return;
  if (IMG_TYPES.test(file.type)) {
    const reader = new FileReader();
    reader.onload = ev => {
      const url = ev.target.result;
      attachedFiles.push({type:'image',mimeType:file.type,name:file.name,previewUrl:url,base64:url.split(',')[1]});
      renderAttachChips(); checkSendBtnState();
    };
    reader.readAsDataURL(file);
  } else if (TEXT_EXTS.test(file.name) || file.type.startsWith('text/')) {
    const reader = new FileReader();
    reader.onload = ev => {
      const content = ev.target.result;
      const lang = langFromName(file.name);
      attachedFiles.push({type:'text',mimeType:file.type||'text/plain',name:file.name,content,lang});
      renderAttachChips(); checkSendBtnState();
    };
    reader.readAsText(file);
  }
}

function renderAttachChips() {
  const bar = $('attachChips');
  bar.replaceChildren();
  if (!attachedFiles.length) { bar.style.display='none'; return; }
  bar.style.display='flex';
  attachedFiles.forEach((f, idx) => {
    const chip = document.createElement('div'); chip.className='attach-chip';
    if (f.type==='image') {
      const img = document.createElement('img'); img.src=f.previewUrl; img.alt=''; chip.appendChild(img);
    } else {
      const ico = document.createElement('div'); ico.className='attach-chip-icon'; ico.innerHTML=ic('file'); chip.appendChild(ico);
    }
    const name = document.createElement('span'); name.className='attach-chip-name'; name.textContent=f.name; chip.appendChild(name);
    const rm = document.createElement('button'); rm.className='attach-chip-rm'; rm.innerHTML=ic('x'); rm.title='Убрать'; rm.setAttribute('aria-label','Убрать файл');
    rm.onclick = () => { attachedFiles.splice(idx,1); renderAttachChips(); checkSendBtnState(); };
    chip.appendChild(rm);
    bar.appendChild(chip);
  });
}

document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', e => { e.preventDefault(); [...e.dataTransfer.files].forEach(handleFile); });

// ─── CHAT ────────────────────────────────────────────────────────
function createNewChat(){const c={id:"chat_"+Date.now(),title:"Новый чат",messages:[],createdAt:Date.now()};decryptedChats.unshift(c);currentChatId=c.id;saveChatsEncrypted();renderChatList();renderMessages();drawer(false)}
function selectChat(id){currentChatId=id;renderChatList();renderMessages();drawer(false)}
function deleteChat(id,ev){ev.stopPropagation();decryptedChats=decryptedChats.filter(c=>c.id!==id);if(currentChatId===id)currentChatId=decryptedChats.length?decryptedChats[0].id:null;saveChatsEncrypted();renderChatList();renderMessages()}
function groupOf(t){const d=new Date().setHours(0,0,0,0);return t>=d?'Сегодня':t>=d-864e5?'Вчера':'Ранее'}
$('newChatBtn').onclick=createNewChat;
$('searchInput').oninput=e=>renderChatList(e.target.value);
function renderChatList(q=""){
  const el=$('chatList');el.replaceChildren();let last='';
  decryptedChats.filter(c=>c.title.toLowerCase().includes(q.toLowerCase())).forEach(chat=>{
    const g=groupOf(chat.createdAt);
    if(g!==last){const h=document.createElement('div');h.className='grp';h.textContent=g;el.appendChild(h);last=g}
    const item=document.createElement('div');item.className='chat-item'+(chat.id===currentChatId?' active':'');item.onclick=()=>selectChat(chat.id);
    const t=document.createElement('span');t.className='chat-item-title';t.textContent=chat.title;
    const d=document.createElement('button');d.className='del';d.innerHTML=ic('trash');d.title='Удалить чат';d.setAttribute('aria-label','Удалить чат');d.onclick=e=>deleteChat(chat.id,e);
    item.append(t,d);el.appendChild(item);
  });
}

const SUGS=["Объясни простыми словами, как работает блокчейн","Помоги вежливо отказаться от предложения по работе","Составь план тренировок на неделю для новичка","Найди ошибку в моём коде и объясни, что не так"];
function renderMessages(){
  const w=$('chatWindow');w.replaceChildren();
  const chat=decryptedChats.find(c=>c.id===currentChatId);
  $('chatTitle').textContent=chat?chat.title:'';
  if(!chat||!chat.messages.length){
    const e=document.createElement('div');e.className='empty';
    e.innerHTML=LOGO.replace('<svg','<svg style="width:64px;height:64px;margin-bottom:22px;animation:flip 1.1s cubic-bezier(.3,1.4,.5,1) .15s both"')+'<h1>Чем могу помочь сегодня?</h1><p>Спросите что угодно, прикрепите файл или перетащите его в окно.</p><div class="sugs"></div>';
    SUGS.forEach(s=>{const b=document.createElement('button');b.className='sug';b.textContent=s;b.onclick=()=>sendMessage(s);e.querySelector('.sugs').appendChild(b)});
    w.appendChild(e);return;
  }
  chat.messages.forEach(m=>appendMessageUI(m.role,m.content,m.images,m.files));
}

const userInput=$('userInput'),sendBtn=$('sendBtn');
function checkSendBtnState(){sendBtn.classList.toggle('active',userInput.value.trim().length>0||attachedFiles.length>0)}
function autosize(){userInput.style.height='auto';userInput.style.height=Math.min(userInput.scrollHeight,200)+'px'}
userInput.addEventListener('input',()=>{checkSendBtnState();autosize()});
userInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}});
userInput.addEventListener('paste',e=>{[...e.clipboardData.files].forEach(f=>{e.preventDefault();handleFile(f)})});
$('codeBtn').onclick=()=>{const s=userInput.selectionStart;userInput.setRangeText('```\n\n```',s,userInput.selectionEnd,'end');userInput.setSelectionRange(s+4,s+4);userInput.focus();autosize();checkSendBtnState()};
sendBtn.onclick=()=>sendMessage();

// ─── ОТПРАВКА И АВТОМАТИЧЕСКИЙ FALLBACK НА GROQ ───────────────────
async function sendMessage(override){
  const text=(typeof override==='string'?override:userInput.value).trim();
  if(!text&&!attachedFiles.length)return;
  if(!currentChatId)createNewChat();
  const currentChat=decryptedChats.find(c=>c.id===currentChatId);
  if(!currentChat.messages.length){
    const tt=text||(attachedFiles[0]?attachedFiles[0].name:'Файл');
    currentChat.title=tt.length>25?tt.substring(0,25)+'...':tt;
    renderChatList();$('chatTitle').textContent=currentChat.title;
  }
  const activeFiles=[...attachedFiles];
  userInput.value='';autosize();attachedFiles=[];renderAttachChips();checkSendBtnState();

  const images=activeFiles.filter(f=>f.type==='image').map(f=>({previewUrl:f.previewUrl,mimeType:f.mimeType,base64:f.base64,name:f.name}));
  const texts=activeFiles.filter(f=>f.type==='text').map(f=>({name:f.name,content:f.content,lang:f.lang}));

  currentChat.messages.push({role:'user',content:text,images,files:texts});
  appendMessageUI('user',text,images,texts);
  await saveChatsEncrypted();

  const loading=appendMessageUI('assistant','',null,null,true);

  // Формат для Gemini API
  const geminiContents=currentChat.messages.map(m=>{
    const parts=[];
    if(m.content)parts.push({text:m.content});
    if(m.files&&m.files.length){
      const fileTexts=m.files.map(f=>`Файл \`${f.name}\`:\n\`\`\`${f.lang}\n${f.content}\n\`\`\``).join('\n\n');
      parts.push({text:fileTexts});
    }
    if(m.images&&m.images.length){
      m.images.forEach(img=>{
        if(img.base64)parts.push({inlineData:{mimeType:img.mimeType,data:img.base64}});
      });
    }
    return {
      role:m.role==='assistant'?'model':'user',
      parts:parts.length?parts:[{text:' '}]
    };
  });

  // Формат для OpenAI / Groq API
  const groqMessages=currentChat.messages.map(m=>{
    let textContent=m.content||'';
    if(m.files&&m.files.length){
      textContent+=(textContent?'\n\n':'')+m.files.map(f=>`Файл \`${f.name}\`:\n\`\`\`${f.lang}\n${f.content}\n\`\`\``).join('\n\n');
    }
    return {
      role:m.role==='assistant'?'assistant':'user',
      content:textContent||'(изображение)'
    };
  });

  try{
    // 1. Первая попытка через Gemini API
    let res=await fetch(WORKER_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({provider:'gemini',contents:geminiContents,messages:groqMessages})
    });

    let data=null;
    const rawText=await res.text();
    try{data=JSON.parse(rawText)}catch(e){}

    // 2. Если Gemini вернет ошибку, переключаемся на Groq API
    if(!res.ok||data?.error||!data?.candidates?.[0]?.content?.parts?.[0]?.text){
      console.warn('Gemini API не ответил или вернул ошибку, пробуем Groq...', data);

      res=await fetch(WORKER_ENDPOINT,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({provider:'groq',messages:groqMessages})
      });

      const groqRaw=await res.text();
      try{data=JSON.parse(groqRaw)}catch(e){}
    }

    loading.remove();

    // Парсим универсальный ответ
    const replyText=data?.candidates?.[0]?.content?.parts?.[0]?.text || data?.choices?.[0]?.message?.content;

    if(replyText){
      currentChat.messages.push({role:'assistant',content:replyText});
      appendMessageUI('assistant',replyText);
      await saveChatsEncrypted();
    }else{
      const errDetail=JSON.stringify(data||rawText,null,2);
      appendMessageUI('assistant',`❌ **Ошибка работы API (Gemini & Groq):**\n\`\`\`json\n${errDetail}\n\`\`\``);
    }
  }catch(err){
    loading.remove();
    appendMessageUI('assistant',`❌ **Ошибка сети:** ${err.message||err}`);
  }
}

// ─── HTML PREVIEW ─────────────────────────────────────────────────
function isHtmlContent(text){
  if(!text)return false;
  const t=text.trim();
  return /<!DOCTYPE\s+html/i.test(t)||/<html[\s>]/i.test(t)||/<body[\s>]/i.test(t)||
         (/<(div|section|article|main|header|nav|ul|table|form)[\s>]/i.test(t)&&/<\/html>/i.test(t));
}
function extractHtmlFromCodeBlock(text){
  const m=text.match(/```html\s*([\s\S]*?)```/i);
  return m?m[1].trim():null;
}

function createHtmlPreviewCard(htmlContent, fileName){
  const card=document.createElement('div');card.className='html-preview-card';
  const bar=document.createElement('div');bar.className='html-preview-topbar';
  const dn=document.createElement('div');dn.className='dots-nav';
  dn.innerHTML='<span></span><span></span><span></span>';
  const lbl=document.createElement('b');lbl.textContent=fileName||'Предпросмотр';
  const toggleBtn=document.createElement('button');
  let visible=true;
  toggleBtn.innerHTML=ic('eyeoff')+' Скрыть';toggleBtn.style.display='flex';toggleBtn.style.alignItems='center';toggleBtn.style.gap='5px';
  bar.append(dn,lbl,toggleBtn);card.appendChild(bar);

  const frame=document.createElement('iframe');frame.className='preview-frame';frame.setAttribute('sandbox','allow-scripts allow-modals');frame.setAttribute('loading','lazy');frame.title='HTML предпросмотр';

  const blob=new Blob([htmlContent],{type:'text/html'});
  frame.src=URL.createObjectURL(blob);
  frame.style.height='400px';

  frame.onload=()=>{
    try{
      const h=frame.contentDocument.documentElement.scrollHeight;
      frame.style.height=Math.min(Math.max(h,200),600)+'px';
    }catch(e){}
  };

  toggleBtn.onclick=()=>{
    visible=!visible;
    frame.style.display=visible?'block':'none';
    toggleBtn.innerHTML=(visible?ic('eyeoff')+' Скрыть':ic('eye')+' Показать');
  };

  card.appendChild(frame);
  return card;
}

// ─── MESSAGE UI ───────────────────────────────────────────────────
async function copyText(t,b){try{await navigator.clipboard.writeText(t);const o=b.innerHTML;b.innerHTML=ic('check')+' Скопировано';setTimeout(()=>b.innerHTML=o,1500)}catch(e){}}

function appendMessageUI(role,text,images=[],files=[],loading=false){
  const w=$('chatWindow');w.querySelector('.empty')?.remove();
  const m=document.createElement('div');m.className='message '+role;
  if(role==='assistant')m.insertAdjacentHTML('afterbegin',LOGO);
  const body=role==='assistant'?Object.assign(document.createElement('div'),{className:'body'}):m;
  if(role==='assistant')m.appendChild(body);

  (images||[]).forEach(img=>{
    const im=document.createElement('img');im.className='msg-img';im.src=img.previewUrl;im.alt='Изображение';
    body.appendChild(im);
  });

  (files||[]).forEach(f=>{
    const chip=document.createElement('div');chip.className='file-chip';
    chip.innerHTML=ic('file');
    const n=document.createElement('span');n.className='file-chip-name';n.textContent=f.name;
    chip.appendChild(n);body.appendChild(chip);
  });

  if(loading){body.innerHTML='<div class="dots"><i></i><i></i><i></i></div>'}
  else if(text){
    const box=document.createElement('div');
    if(role==='assistant'){
      box.className='md';
      box.innerHTML=DOMPurify.sanitize(marked.parse(text));
      box.querySelectorAll('pre').forEach(pre=>{
        const code=pre.querySelector('code');if(!code)return;
        const langClass=(code.className.match(/language-(\w+)/)||[])[1]||'';
        hljs.highlightElement(code);
        const bar=document.createElement('div');bar.className='cbar';
        bar.innerHTML=`<span>${langClass||'код'}</span>`;
        const rightBtns=document.createElement('div');rightBtns.style.display='flex';rightBtns.style.gap='4px';
        const cb=document.createElement('button');cb.innerHTML=ic('copy')+' Копировать';cb.onclick=()=>copyText(code.textContent,cb);
        rightBtns.appendChild(cb);
        if(langClass==='html'||langClass==='htm'){
          const pb=document.createElement('button');pb.className='cbar-preview';pb.innerHTML=ic('eye')+' Запустить';
          pb.onclick=()=>{
            const existing=pre.nextElementSibling;
            if(existing&&existing.classList.contains('html-preview-card')){existing.remove();pb.innerHTML=ic('eye')+' Запустить';return}
            const card=createHtmlPreviewCard(code.textContent,'preview.html');
            pre.insertAdjacentElement('afterend',card);
            pb.innerHTML=ic('eyeoff')+' Скрыть';
          };
          rightBtns.appendChild(pb);
        }
        bar.appendChild(rightBtns);pre.prepend(bar);
      });
      const rawHtml=extractHtmlFromCodeBlock(text);
      if(!rawHtml && isHtmlContent(text)){
        const card=createHtmlPreviewCard(text,'Предпросмотр');
        body.appendChild(card);
      }
      body.appendChild(box);
      const acts=document.createElement('div');acts.className='acts';
      const cbMain=document.createElement('button');cbMain.innerHTML=ic('copy')+' Копировать';cbMain.onclick=()=>copyText(text,cbMain);
      acts.appendChild(cbMain);body.appendChild(acts);
    }else{
      box.textContent=text;body.appendChild(box);
    }
  }
  w.appendChild(m);$('scroll').scrollTop=$('scroll').scrollHeight;
  return m;
}
</script>
